name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

      - name: Check tag matches package.json version
        run: test "$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Write App Store Connect API key
        run: echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      # Import the Developer ID cert into our own keychain instead of letting
      # electron-builder do it: 26.15.x passes the .p12 password to
      # set-key-partition-list where the keychain password is required.
      - name: Import Developer ID certificate
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build, sign and notarize
        run: npm run dist -- --publish never
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify signature and notarization
        run: |
          codesign --verify --deep --strict -vv "dist/mac-arm64/Rae Proxy.app"
          spctl -a -vvv -t exec "dist/mac-arm64/Rae Proxy.app"
          xcrun stapler validate "dist/mac-arm64/Rae Proxy.app"

      # Immutable releases are enabled on this repo: a published release can't
      # take new assets, so upload to a draft and publish it last.
      - name: Upload DMG to GitHub Release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/RaeProxy-*.dmg --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

      # github.token can't push to another repo, so the tap needs its own
      # token (fine-grained PAT, Contents: write on musti-91/homebrew-tap).
      - name: Update Homebrew tap
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set, skipping tap update"
            exit 0
          fi
          SHA256="$(shasum -a 256 "dist/RaeProxy-$GITHUB_REF_NAME-arm64.dmg" | cut -d' ' -f1)"
          TAP="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/musti-91/homebrew-tap.git" "$TAP"
          mkdir -p "$TAP/Casks"
          sed -e "s/__VERSION__/$GITHUB_REF_NAME/" -e "s/__SHA256__/$SHA256/" \
            build/homebrew/rae-proxy.rb > "$TAP/Casks/rae-proxy.rb"
          cd "$TAP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/rae-proxy.rb
          git commit -m "rae-proxy $GITHUB_REF_NAME"
          git push
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
